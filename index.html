
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>

    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@14/swiper-bundle.min.css"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .movie-slide {
            position: relative;
            height: 440px;
            overflow: hidden;
            border-radius: 16px;
        }

        .movie-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: end;
            padding: 28px;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.95),
                rgba(0, 0, 0, 0.05)
            );
        }

        .movie-card {
            background: #171717;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        .movie-description {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .swiper-button-next,
        .swiper-button-prev {
            color: white;
        }

        .swiper-pagination-bullet {
            background: white;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="flex flex-wrap justify-between items-center gap-5
                border border-white/20 mx-4 mt-5 px-6 py-4
                rounded-full font-[Nunito]">

        <a href="#" class="flex items-center gap-3 shrink-0">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
                <circle cx="4.7" cy="16" r="4.7" fill="#1aaa54"/>
                <circle cx="16" cy="4.7" r="4.7" fill="#1aaa54"/>
                <circle cx="16" cy="27.3" r="4.7" fill="#1aaa54"/>
                <circle cx="27.3" cy="16" r="4.7" fill="#1aaa54"/>
            </svg>
            <span class="text-xl font-bold">Movie<span class="text-green-500">Verse</span></span>
        </a>

        <div class="hidden md:flex items-center gap-7 text-sm">
            <a href="#" class="hover:text-green-400">Home</a>
            <a href="#movies" class="hover:text-green-400">Movies</a>
            <a href="#tvshows" class="hover:text-green-400">TV Shows</a>
            <a href="#mylist" class="hover:text-green-400">My List</a>
        </div>

        <!-- SEARCH FORM -->
        <form id="searchForm"
              class="flex items-center gap-3 border border-white/30
                     rounded-full px-4 h-11 w-full md:w-72">

            <svg width="20" height="20" viewBox="0 0 30 30"
                 fill="white" aria-hidden="true">
                <path d="M13 3C7.489 3 3 7.489 3 13s4.489 10
                10 10a9.95 9.95 0 0 0 6.322-2.264l5.971
                5.971a1 1 0 1 0 1.414-1.414l-5.97-5.97A9.95
                9.95 0 0 0 23 13c0-5.511-4.489-10-10-10m0
                2c4.43 0 8 3.57 8 8s-3.57 8-8 8-8-3.57-8-8
                3.57-8 8-8"/>
            </svg>

            <input
                id="searchInput"
                type="search"
                placeholder="Search movies..."
                class="w-full bg-transparent outline-none text-white
                       placeholder-gray-400"
                aria-label="Search movies"
            >

            <button type="submit" class="text-green-400 font-semibold">
                Go
            </button>
        </form>
    </nav>

    <!-- HERO / MOVIE SLIDER -->
    <section class="px-4 md:px-8 mt-8 font-[Nunito]">
        <h1 class="text-3xl md:text-4xl font-bold mb-6">
            Discover Movies
        </h1>

        <swiper-container
            id="movieSwiper"
            slides-per-view="1"
            space-between="20"
            loop="false"
            navigation="true"
            pagination="true"
        >
            <!-- Slides are inserted using JavaScript -->
        </swiper-container>
    </section>

    <!-- MOVIE GRID -->
    <section id="movies" class="px-4 md:px-8 py-12 font-[Nunito]">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
            <h2 id="sectionTitle" class="text-2xl font-bold">
                Popular Movies
            </h2>

            <p id="movieCount" class="text-gray-400 text-sm"></p>
        </div>

        <div
            id="movieGrid"
            class="grid grid-cols-2 sm:grid-cols-3
                   lg:grid-cols-6 xl:grid-cols-5 gap-5"
        >Loading movies ....
            <!-- Movie cards are inserted using JavaScript -->
        </div>
    </section>

    <!-- Swiper JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14/swiper-element-bundle.min.js"></script>

    
<script>
    async function DisplayMovie() {
        try {
            const API_KEY = "43b1572ae2bd8b9107ac4af110136374";
            const movieSection = document.querySelector("#movieGrid");
            const searchInput = document.querySelector("#searchInput").value.trim();

            movieSection.innerHTML = "<p>Loading movies...</p>";

            // Fetch 3 pages of popular movies
            let allMovies = [];

            for (let page = 1; page <= 3; page++) {
                const response = await fetch(
                    `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=${page}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json();

                // Combine the results of each page
                allMovies = allMovies.concat(data.results);
            }

            console.log("Total movies fetched:", allMovies.length);

            // Filter movies if the search input is not empty
            let movies = allMovies;

            if (searchInput) {
                movies = allMovies.filter(movie =>
                    movie.title.toLowerCase().includes(searchInput.toLowerCase())
                );
            }

            // Display a message if no movies match
            if (movies.length === 0) {
                movieSection.innerHTML = "<p>No movies found!</p>";
                return;
            }

            // Render movie cards
            movieSection.innerHTML = movies.map(movie => `
                <div class="movie-card">
                    ${
                        movie.poster_path
                            ? `<img
                                class="movie-poster"
                                src="https://image.tmdb.org/t/p/w500${movie.poster_path}"
                                alt="${movie.title}"
                                loading="lazy"
                            >`
                            : `<p class="p-3">Poster unavailable</p>`
                    }

                    <h2 class="font-medium p-3">
                        ${movie.title}
                    </h2>
                </div>
            `).join("");

            document.querySelector("#movieCount").textContent =
                `${movies.length} movies found`;

        } catch (err) {
            console.error("Something went wrong:", err);

            document.querySelector("#movieGrid").innerHTML =
                "<p>Unable to load movies. Please try again later.</p>";
        }
    }

    // Handle search form submission
    document.querySelector("#searchForm").addEventListener("submit", event => {
        event.preventDefault();
        DisplayMovie();
    });

    // Load movies when the page opens
    DisplayMovie();
</script>

    

</body>
</html>
